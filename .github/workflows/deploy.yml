name: Deploy to LWS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: FTP Deploy → LWS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.oeilvigilant.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          port: 21
          protocol: ftp
          local-dir: ./
          server-dir: /planning/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            config/config.php
            uploads/photos/**
            uploads/documents/**
            *.log
            INSTALL.md
            CLAUDE.md
          dangerous-clean-slate: false
          log-level: standard
